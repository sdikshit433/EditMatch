{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="auth-box card">
  <h1>Log in</h1>

  {% if errors %}
    <div class="error-box" role="alert">
      <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
    </div>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email" class="required">Email</label>
      <input id="email" name="email" type="email" value="{{ values.get('email', '') }}" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password" class="required">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-large" data-loading-text="Logging in...">Log In</button>
  </form>
  <p class="small muted" style="margin-top:16px">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
